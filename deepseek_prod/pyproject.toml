[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-prod"
version = "0.1.0"
description = "Cấp 4: đưa một LLM ra chạy thật — song song hoá khi huấn luyện và phục vụ nhiều người cùng lúc"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "distributed", "tensor-parallel", "pipeline-parallel", "zero", "vllm", "paged-attention"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Education",
]

dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
deepseek-prod = "deepseek_prod.__main__:main"

[tool.setuptools]
packages = ["deepseek_prod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
